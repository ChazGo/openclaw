name: MXC Bundled Package Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.15.0"
          install-bun: "false"

      - name: Download exact-head root package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: "8769268172"
          github-token: ${{ github.token }}
          path: .artifacts/root-candidate
          repository: ChazGo/openclaw
          run-id: "30566707628"

      - name: Download exact-head MXC package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: "8769463191"
          github-token: ${{ github.token }}
          path: .artifacts/mxc-candidate
          repository: ChazGo/openclaw
          run-id: "30567377477"

      - name: Install and bundle MXC
        run: |
          set -euo pipefail
          mkdir -p .artifacts/mxc-handoff
          root_tgz="$(find .artifacts/root-candidate -name 'openclaw-*.tgz' ! -name '*mxc*' -print -quit)"
          mxc_tgz="$(find .artifacts/mxc-candidate -name '*mxc*sandbox*.tgz' -print -quit)"
          test -n "$root_tgz"
          test -n "$mxc_tgz"
          cp "$root_tgz" "$mxc_tgz" .artifacts/mxc-handoff/

          npm install \
            --prefix .artifacts/root-install \
            --ignore-scripts=false \
            --no-audit \
            --no-fund \
            "$root_tgz"
          npm install \
            --prefix .artifacts/mxc-install \
            --ignore-scripts=false \
            --no-audit \
            --no-fund \
            "$mxc_tgz"

          installed_root=".artifacts/root-install/node_modules/openclaw"
          installed_mxc=".artifacts/mxc-install/node_modules/@openclaw/mxc-sandbox"
          bundled_mxc="$installed_root/dist/extensions/mxc"
          mkdir -p "$bundled_mxc/node_modules"
          cp -a "$installed_mxc/dist/." "$bundled_mxc/"
          cp "$installed_mxc/openclaw.plugin.json" "$bundled_mxc/"
          cp "$installed_mxc/npm-shrinkwrap.json" "$bundled_mxc/"
          cp "$installed_mxc/README.md" "$bundled_mxc/"
          cp -a .artifacts/mxc-install/node_modules/. "$bundled_mxc/node_modules/"
          rm -rf "$bundled_mxc/node_modules/@openclaw/mxc-sandbox"

          INSTALLED_MXC="$installed_mxc" BUNDLED_MXC="$bundled_mxc" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const source = JSON.parse(
            fs.readFileSync(path.join(process.env.INSTALLED_MXC, "package.json"), "utf8"),
          );
          source.openclaw.extensions = ["./index.js"];
          delete source.openclaw.runtimeExtensions;
          delete source.openclaw.build;
          fs.writeFileSync(
            path.join(process.env.BUNDLED_MXC, "package.json"),
            `${JSON.stringify(source, null, 2)}\n`,
          );
          NODE

      - name: Prove bundled discovery and trust
        run: |
          set -euo pipefail
          state_dir="$GITHUB_WORKSPACE/.artifacts/proof-state"
          mkdir -p "$state_dir"
          printf '%s\n' '{"plugins":{"entries":{"mxc":{"enabled":true}}}}' \
            > "$state_dir/openclaw.json"
          export OPENCLAW_STATE_DIR="$state_dir"
          node .artifacts/root-install/node_modules/openclaw/openclaw.mjs \
            plugins inspect mxc --runtime --json \
            | tee .artifacts/mxc-handoff/mxc-runtime-inspect.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(
              fs.readFileSync(".artifacts/mxc-handoff/mxc-runtime-inspect.json", "utf8"),
            );
            if (
              report.plugin?.id !== "mxc" ||
              report.plugin?.status !== "loaded" ||
              report.plugin?.origin !== "bundled"
            ) {
              throw new Error(`MXC runtime proof failed: ${JSON.stringify(report)}`);
            }
          '

      - name: Create handoff payload
        run: |
          set -euo pipefail
          bundled_mxc=".artifacts/root-install/node_modules/openclaw/dist/extensions/mxc"
          (
            cd "$bundled_mxc"
            zip -qr "$GITHUB_WORKSPACE/.artifacts/mxc-handoff/openclaw-mxc-bundled-e763e44427.zip" .
          )
          (
            cd .artifacts/mxc-handoff
            sha256sum *.tgz *.zip mxc-runtime-inspect.json > SHA256SUMS.txt
          )

      - name: Upload handoff payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 0
          if-no-files-found: error
          name: openclaw-mxc-windows-test-e763e44427
          path: .artifacts/mxc-handoff/
          retention-days: 14
